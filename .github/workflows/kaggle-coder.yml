name: Kaggle Coder Server
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "kaggle==1.6.17"
      - name: Push & start Coder server di Kaggle
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME_PUMPYDARK }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY_PUMPYDARK }}
        run: |
          mkdir -p ~/.kaggle
          python - <<'PY'
          import json, os
          json.dump({"username": os.environ["KAGGLE_USERNAME"], "key": os.environ["KAGGLE_KEY"]},
                    open(os.path.expanduser("~/.kaggle/kaggle.json"), "w"))
          os.chmod(os.path.expanduser("~/.kaggle/kaggle.json"), 0o600)
          src = open("kaggle/coder_kaggle.py").read()
          src = (src.replace('"__UPSTASH_URL__"', json.dumps(os.environ["UPSTASH_URL"]))
                    .replace('"__UPSTASH_TOKEN__"', json.dumps(os.environ["UPSTASH_TOKEN"])))
          d = os.path.expanduser("~/coder-push"); os.makedirs(d, exist_ok=True)
          open(f"{d}/coder_kaggle.py", "w").write(src)
          json.dump({"id": f'{os.environ["KAGGLE_USERNAME"]}/wengpt-coder-server',
                     "title": "wengpt-coder-server", "code_file": "coder_kaggle.py",
                     "language": "python", "kernel_type": "script", "is_private": True,
                     "enable_gpu": True, "enable_internet": True,
                     "machine_shape": "NvidiaTeslaT4",
                     "dataset_sources": ["pumpydark/qwen3-coder-cache"],
                     "competition_sources": [], "kernel_sources": [], "model_sources": []},
                    open(f"{d}/kernel-metadata.json", "w"))
          PY
          kaggle kernels push -p ~/coder-push
