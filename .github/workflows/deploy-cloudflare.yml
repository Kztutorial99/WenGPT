name: Deploy Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Deploy
        run: bunx wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync secrets ke Worker
        run: |
          for k in AI_API_KEY AI_BASE_URL AI_MODEL AI_REGISTRY_TOKEN AI_REGISTRY_URL FIRECRAWL_API_KEY E2B_API_KEY; do
            v="${!k}"; [ -n "$v" ] && printf '%s' "$v" | bunx wrangler@4 secret put "$k" --config wrangler.jsonc || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_REGISTRY_TOKEN: ${{ secrets.AI_REGISTRY_TOKEN }}
          AI_REGISTRY_URL: ${{ secrets.AI_REGISTRY_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
